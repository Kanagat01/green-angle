# Окружение для разработки: API + Postgres + Redis. Файлы лежат на диске сервера (том uploads).
# MinIO нужен только для драйвера S3 и поднимается профилем: docker compose --profile s3 up -d
# (и STORAGE_DRIVER=s3 у API). Боевой запуск — docker-compose.prod.yml.
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: green
      POSTGRES_PASSWORD: green
      POSTGRES_DB: green_angle
    ports: ['5432:5432']
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U green -d green_angle']
      interval: 5s
      timeout: 3s
      retries: 10

  # Общие счётчики rate limit. Данные эфемерные, на диск не пишем
  redis:
    image: redis:7-alpine
    command: ['redis-server', '--save', '', '--appendonly', 'no']
    ports: ['6379:6379']
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 3s
      retries: 10

  minio:
    profiles: ['s3']
    # Официальные образы minio/minio недоступны на Docker Hub — используем сборку coollabsio
    image: ghcr.io/coollabsio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minio
      MINIO_ROOT_PASSWORD: minio12345
    ports: ['9000:9000', '9001:9001']
    volumes: [miniodata:/data]

  # Применяет миграции и завершается; API стартует только после успешного применения
  migrate:
    build:
      context: ./backend
      target: migrate
    depends_on:
      postgres: { condition: service_healthy }
    environment:
      DATABASE_URL: postgresql://green:green@postgres:5432/green_angle?schema=public
    restart: 'no'

  api:
    build:
      context: ./backend
      target: runtime
    depends_on:
      migrate: { condition: service_completed_successfully }
      redis: { condition: service_healthy }
    environment:
      # development: в этом окружении допустимы заглушки секретов (в production они запрещены)
      NODE_ENV: development
      PORT: 3000
      DATABASE_URL: postgresql://green:green@postgres:5432/green_angle?schema=public
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET:-change-me-access-secret-min-16}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET:-change-me-refresh-secret-min-16}
      # файлы на диске сервера (том uploads); для S3: STORAGE_DRIVER=s3 и профиль s3 у minio
      STORAGE_DRIVER: ${STORAGE_DRIVER:-disk}
      FILES_SIGNING_SECRET: ${FILES_SIGNING_SECRET:-change-me-files-secret-min-16}
      # ссылки на файлы — адрес API, который видит браузер
      FILES_PUBLIC_URL: http://localhost:3000/api/v1
      S3_ENDPOINT: http://minio:9000
      # адрес в presigned URL — тот, который видит браузер
      S3_PUBLIC_ENDPOINT: http://localhost:9000
      S3_REGION: us-east-1
      S3_BUCKET: green-angle
      S3_ACCESS_KEY: minio
      S3_SECRET_KEY: minio12345
      # почта: без SMTP_HOST письма пишутся в лог API (docker compose logs api)
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_SECURE: ${SMTP_SECURE:-}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASS: ${SMTP_PASS:-}
      MAIL_FROM: ${MAIL_FROM:-Green Angle <noreply@localhost>}
      APP_URL: ${APP_URL:-http://localhost:3001}
      REDIS_URL: redis://redis:6379
      FFPROBE_PATH: ffprobe
      # фронт локально — Next.js на :3001
      CORS_ORIGINS: http://localhost:3001
    ports: ['3000:3000']
    volumes: [uploads:/data/uploads]

volumes:
  pgdata:
  uploads:
  miniodata:
