name: CI
on: [push, pull_request]
jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: green
          POSTGRES_PASSWORD: green
          POSTGRES_DB: green_angle
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U green -d green_angle"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports: ['6379:6379']
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://green:green@localhost:5432/green_angle?schema=public
      JWT_ACCESS_SECRET: ci-access-secret-1234567890
      JWT_REFRESH_SECRET: ci-refresh-secret-1234567890
      S3_ENDPOINT: http://localhost:9000
      S3_BUCKET: green-angle
      S3_ACCESS_KEY: minio
      S3_SECRET_KEY: minio12345
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with: { version: 11 }
      - uses: actions/setup-node@v4
        with: { node-version: 24, cache: pnpm, cache-dependency-path: backend/pnpm-lock.yaml }
      - name: Start MinIO
        # service-контейнеры не принимают аргументы запуска, поэтому docker run
        run: |
          docker run -d --name minio -p 9000:9000 \
            -e MINIO_ROOT_USER=minio -e MINIO_ROOT_PASSWORD=minio12345 \
            ghcr.io/coollabsio/minio:latest server /data
          curl -sf --retry 30 --retry-connrefused --retry-delay 1 http://localhost:9000/minio/health/live
      - run: pnpm install --frozen-lockfile
      - run: pnpm prisma generate
      - run: pnpm prisma migrate deploy
      - run: pnpm lint
      - run: pnpm build
      - run: pnpm test
      - run: pnpm test:e2e

  # Боевые образы должны собираться (иначе ошибка вскроется только при деплое)
  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build ./backend --target runtime -t green-angle-api
      - run: docker build ./backend --target migrate -t green-angle-migrate
