# Боевой запуск: Caddy (HTTPS) → API → Postgres, миграции и ежедневные резервные копии БД.
# Файлы (фото, видео, голосовые) хранятся во внешнем S3 (Yandex Object Storage / Selectel) —
# MinIO здесь нет. Все настройки — в .env.prod (шаблон: .env.prod.example).
#
#   docker compose -f docker-compose.prod.yml --env-file .env.prod up -d --build
services:
  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports: ['80:80', '443:443']
    environment:
      DOMAIN: ${DOMAIN:?DOMAIN is required}
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      api: { condition: service_healthy }

  api:
    build:
      context: ./backend
      target: runtime
    restart: unless-stopped
    depends_on:
      migrate: { condition: service_completed_successfully }
    environment:
      NODE_ENV: production
      PORT: 3000
      TRUST_PROXY: 'true'
      LOG_LEVEL: ${LOG_LEVEL:-info}
      DATABASE_URL: postgresql://green:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}@postgres:5432/green_angle?schema=public
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET:?JWT_ACCESS_SECRET is required}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET:?JWT_REFRESH_SECRET is required}
      S3_ENDPOINT: ${S3_ENDPOINT:?S3_ENDPOINT is required}
      S3_PUBLIC_ENDPOINT: ${S3_PUBLIC_ENDPOINT:-}
      S3_REGION: ${S3_REGION:-ru-central1}
      S3_BUCKET: ${S3_BUCKET:?S3_BUCKET is required}
      S3_ACCESS_KEY: ${S3_ACCESS_KEY:?S3_ACCESS_KEY is required}
      S3_SECRET_KEY: ${S3_SECRET_KEY:?S3_SECRET_KEY is required}
      STRICT_ATTACHMENTS: ${STRICT_ATTACHMENTS:-false}
      CORS_ORIGINS: ${CORS_ORIGINS:-}
      SWAGGER_ENABLED: ${SWAGGER_ENABLED:-false}
    expose: ['3000']

  migrate:
    build:
      context: ./backend
      target: migrate
    depends_on:
      postgres: { condition: service_healthy }
    environment:
      DATABASE_URL: postgresql://green:${POSTGRES_PASSWORD}@postgres:5432/green_angle?schema=public
    restart: 'no'

  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: green
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      POSTGRES_DB: green_angle
    volumes: [pgdata:/var/lib/postgresql/data]
    # Порт наружу не публикуется: к базе ходят только контейнеры этой сети
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U green -d green_angle']
      interval: 10s
      timeout: 3s
      retries: 10

  # Копия базы раз в BACKUP_INTERVAL_SEC (по умолчанию сутки) в ./backups, хранится BACKUP_KEEP_DAYS суток.
  # Копии лежат на том же сервере — периодически выгружайте ./backups в другое место.
  backup:
    image: postgres:16-alpine
    restart: unless-stopped
    depends_on:
      postgres: { condition: service_healthy }
    entrypoint: ['/bin/sh', '/scripts/backup.sh']
    environment:
      PGHOST: postgres
      PGUSER: green
      PGPASSWORD: ${POSTGRES_PASSWORD}
      PGDATABASE: green_angle
      BACKUP_DIR: /backups
      BACKUP_KEEP_DAYS: ${BACKUP_KEEP_DAYS:-14}
      BACKUP_INTERVAL_SEC: ${BACKUP_INTERVAL_SEC:-86400}
    volumes:
      - ./deploy/backup:/scripts:ro
      - ./backups:/backups

volumes:
  pgdata:
  caddy_data:
  caddy_config:
