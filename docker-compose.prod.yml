# Боевой запуск: Caddy (HTTPS) → API → Postgres, миграции и ежедневные резервные копии БД.
# Файлы (фото, видео, голосовые) лежат на диске сервера (том uploads; он входит в резервную копию).
# Вернуться на внешний S3 (Yandex Object Storage / Selectel): STORAGE_DRIVER=s3 и переменные S3_*.
# Все настройки — в .env.prod (шаблон: .env.prod.example).
#
#   docker compose -f docker-compose.prod.yml --env-file .env.prod up -d --build
services:
  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports: ['80:80', '443:443']
    environment:
      DOMAIN: ${DOMAIN:?DOMAIN is required}
      APP_DOMAIN: ${APP_DOMAIN:?APP_DOMAIN is required}
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      api: { condition: service_healthy }
      web: { condition: service_healthy }

  # Сайт и личные кабинеты (Next.js). Адрес API вшивается в код при сборке: сменили DOMAIN — пересоберите образ.
  web:
    build:
      context: ./frontend
      args:
        NEXT_PUBLIC_API_URL: https://${DOMAIN}/api/v1
    restart: unless-stopped
    expose: ['3000']

  api:
    build:
      context: ./backend
      target: runtime
    restart: unless-stopped
    depends_on:
      migrate: { condition: service_completed_successfully }
      redis: { condition: service_healthy }
    environment:
      NODE_ENV: production
      REDIS_URL: redis://redis:6379
      FFPROBE_PATH: ffprobe
      PORT: 4000
      TRUST_PROXY: 'true'
      LOG_LEVEL: ${LOG_LEVEL:-info}
      DATABASE_URL: postgresql://green:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}@postgres:5432/green_angle?schema=public
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET:?JWT_ACCESS_SECRET is required}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET:?JWT_REFRESH_SECRET is required}
      STORAGE_DRIVER: ${STORAGE_DRIVER:-disk}
      FILES_SIGNING_SECRET: ${FILES_SIGNING_SECRET:?FILES_SIGNING_SECRET is required}
      # ссылки на файлы ведут на тот же домен, что и API
      FILES_PUBLIC_URL: https://${DOMAIN}/api/v1
      S3_ENDPOINT: ${S3_ENDPOINT:-}
      S3_PUBLIC_ENDPOINT: ${S3_PUBLIC_ENDPOINT:-}
      S3_REGION: ${S3_REGION:-ru-central1}
      S3_BUCKET: ${S3_BUCKET:-}
      S3_ACCESS_KEY: ${S3_ACCESS_KEY:-}
      S3_SECRET_KEY: ${S3_SECRET_KEY:-}
      SMTP_HOST: ${SMTP_HOST:?SMTP_HOST is required}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_SECURE: ${SMTP_SECURE:-}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASS: ${SMTP_PASS:-}
      MAIL_FROM: ${MAIL_FROM:?MAIL_FROM is required}
      APP_URL: ${APP_URL:?APP_URL is required}
      VAPID_PUBLIC_KEY: ${VAPID_PUBLIC_KEY:?VAPID_PUBLIC_KEY is required}
      VAPID_PRIVATE_KEY: ${VAPID_PRIVATE_KEY:?VAPID_PRIVATE_KEY is required}
      VAPID_SUBJECT: ${VAPID_SUBJECT:?VAPID_SUBJECT is required}
      PUSH_FALLBACK_MINUTES: ${PUSH_FALLBACK_MINUTES:-60}
      CORS_ORIGINS: ${CORS_ORIGINS:-}
      SWAGGER_ENABLED: ${SWAGGER_ENABLED:-false}
    volumes: [uploads:/data/uploads]
    expose: ['4000']

  migrate:
    build:
      context: ./backend
      target: migrate
    depends_on:
      postgres: { condition: service_healthy }
    environment:
      DATABASE_URL: postgresql://green:${POSTGRES_PASSWORD}@postgres:5432/green_angle?schema=public
    restart: 'no'

  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: green
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      POSTGRES_DB: green_angle
    volumes: [pgdata:/var/lib/postgresql/data]
    # Порт наружу не публикуется: к базе ходят только контейнеры этой сети
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U green -d green_angle']
      interval: 10s
      timeout: 3s
      retries: 10

  # Общие счётчики rate limit для всех экземпляров API. Данные эфемерные (на диск не пишутся),
  # порт наружу не публикуется. Если Redis недоступен, API считает лимиты в памяти и продолжает работать.
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command:
      - redis-server
      - --save
      - ''
      - --appendonly
      - 'no'
      - --maxmemory
      - 64mb
      - --maxmemory-policy
      - volatile-ttl
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 10s
      timeout: 3s
      retries: 10

  # Копия базы и файлов раз в BACKUP_INTERVAL_SEC (по умолчанию сутки) в ./backups, хранится BACKUP_KEEP_DAYS суток.
  # Файлы копируются архивом полностью (BACKUP_UPLOADS=false отключает; для больших объёмов лучше снимки диска).
  # Копии лежат на том же сервере — периодически выгружайте ./backups в другое место.
  backup:
    image: postgres:16-alpine
    restart: unless-stopped
    depends_on:
      postgres: { condition: service_healthy }
    entrypoint: ['/bin/sh', '/scripts/backup.sh']
    environment:
      PGHOST: postgres
      PGUSER: green
      PGPASSWORD: ${POSTGRES_PASSWORD}
      PGDATABASE: green_angle
      BACKUP_DIR: /backups
      BACKUP_KEEP_DAYS: ${BACKUP_KEEP_DAYS:-14}
      BACKUP_INTERVAL_SEC: ${BACKUP_INTERVAL_SEC:-86400}
      BACKUP_UPLOADS: ${BACKUP_UPLOADS:-true}
      UPLOADS_DIR: /data/uploads
    volumes:
      - ./deploy/backup:/scripts:ro
      - ./backups:/backups
      - uploads:/data/uploads:ro

volumes:
  pgdata:
  uploads:
  caddy_data:
  caddy_config:
